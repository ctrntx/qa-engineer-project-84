---
- summary: |
    Успешное добавление товара в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины
  prerequisites: |
    Открыта страница каталога товаров; в каталоге есть хотя бы один товар
  test-data: |
    Товар: «Наушники», цена: 5000 ₽, цена со скидкой: 4000 ₽
  steps:
    - Найти товар «Наушники» в каталоге
    - Нажать кнопку «Добавить в корзину»
    - Проверить счётчик корзины
  expected-result: |
    Товар появился в корзине, счётчик обновился, страница не перезагрузилась (SPA)

- summary: |
    Фильтрация товаров по категории и просмотр результата
  requirement: |
    Пользователь должен иметь возможность фильтровать товары; должен быть реализован постраничный вывод
  prerequisites: |
    Открыта страница каталога; в каталоге есть товары разных категорий
  test-data: |
    Категория: «Электроника», страница: 1
  steps:
    - Выбрать категорию «Электроника» в фильтре
    - Проверить количество отображённых товаров
    - Нажать кнопку «Далее» для перехода на следующую страницу
  expected-result: |
    Отображаются только товары категории «Электроника», работает пагинация, страница не перезагружается (SPA)

- summary: |
    Удаление товара из корзины
  requirement: |
    Пользователь должен иметь возможность удалять товары из корзины
  prerequisites: |
    В корзине есть хотя бы один товар; открыта страница корзины
  test-data: |
    Товар: «Наушники», количество: 1
  steps:
    - Открыть страницу корзины
    - Нажать кнопку «Удалить» рядом с товаром
    - Проверить содержимое корзины
  expected-result: |
    Товар исчез из корзины, счётчик обновился, страница не перезагрузилась (SPA)
