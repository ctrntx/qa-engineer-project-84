---
test-cases:
  - summary: |
      Оформление заказа: кнопка Check Out (проверка исправления: ошибка 500 при POST /orders + окно «Order placed successfully»)
    status: fail

  - summary: |
      Смена языка (проверка исправления: язык интерфейса + названия/описания товаров)
    status: fail

  - summary: |
      Корзина: счётчик показывает количество, на странице корзины отображаются товары
    status: pass

  - summary: |
      Фильтр по цене: товар фильтруется по цене со скидкой
    status: pass

  - summary: |
      Флажок «В наличии»: при снятии флажка товары не исчезают полностью
    status: pass

  - summary: |
      Хештег (beauty и др.): при нажатии список обновляется
    status: pass

  - summary: |
      Базовая проверка: страница загружается, в Console (F12) нет красных ошибок
    status: pass

bugreports:
  - summary: |
      Ошибка 500 при оформлении заказа (кнопка Check Out): запрос POST products-store.hexlet.app/orders возвращает 500, при этом отображается окно «Order placed successfully». Баг не исправлен.
    environment: |
      Hexlet Store, вторая версия (new build), Mozilla Firefox (последняя версия), Windows 11
    steps-to-reproduce: |
      1. Открыть страницу каталога товаров.
      2. Добавить товар в корзину.
      3. Открыть корзину.
      4. Нажать кнопку Check Out.
    expected-result: |
      Заказ оформляется корректно, статус запроса в Network — 200, в консоли нет ошибок.
    actual-result: |
      Ошибка 500 при запросе POST products-store.hexlet.app/orders. На экране отображается модальное окно «Order placed successfully». Баг не исправлен.

  - summary: |
      При смене языка язык интерфейса меняется, а названия и описания товаров остаются на английском. Баг не исправлен.
    environment: |
      Hexlet Store, вторая версия (new build), Mozilla Firefox (последняя версия), Windows 11
    steps-to-reproduce: |
      1. Открыть страницу каталога товаров.
      2. Сменить язык через выпадающий список Language.
      3. Проверить страницу каталога.
    expected-result: |
      Язык интерфейса, названия товаров и их описания меняются на выбранный язык.
    actual-result: |
      Язык интерфейса изменился, названия товаров (например, Hand Blender) и их описания остались на английском. Баг не исправлен.
