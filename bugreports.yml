---
- summary: |
    Ошибка 500 при оформлении заказа (кнопка Check Out): интерфейс показывает «Order placed successfully», а запрос POST /orders возвращает 500
  environment: |
    Mozilla Firefox, Windows 11
    Hexlet Store (репозиторий qa-engineer-project-84)
  steps-to-reproduce: |
    1. Открыть страницу каталога товаров.
    2. Добавить товар Hand Blender в корзину (кнопка «Добавить в корзину»).
    3. Открыть корзину.
    4. Нажать кнопку Check Out.
  expected-result: |
    Заказ оформлен корректно, отображается сообщение об успешном создании заказа, корзина очищается, статус запроса в Network — 200, в консоли нет ошибок.
  actual-result: |
    На экране отображается модальное окно «Order placed successfully». Вкладка Network: запрос POST products-store.hexlet.app/orders имеет статус 500. Противоречие: интерфейс сообщает об успехе, сервер возвращает ошибку 500.

- summary: |
    При смене языка названия товаров и их описания остаются на английском (меняется только язык интерфейса)
  environment: |
    Mozilla Firefox, Windows 11
    Hexlet Store (репозиторий qa-engineer-project-84)
  steps-to-reproduce: |
    1. Открыть страницу каталога товаров (названия товаров на английском: Hand Blender и др.).
    2. Сменить язык интерфейса (через выпадающий список Language).
    3. Проверить страницу каталога.
  expected-result: |
    Язык интерфейса, названия товаров и их описания меняются на выбранный язык.
  actual-result: |
    Язык интерфейса изменился (кнопки, заголовки, сообщения — на выбранном языке), но названия товаров (например, Hand Blender) и их описания остались на английском.

- summary: |
    Фильтр по цене ориентируется на исходную цену, а не на цену со скидкой.
  environment: |
    Mozilla Firefox, Windows 11
    Hexlet Store (репозиторий qa-engineer-project-84)
  steps-to-reproduce: |
    1. Открыть страницу каталога товаров.
    2. Найти товар со скидкой (исходная цена 13 $, цена со скидкой 11 $).
    3. Установить фильтр по цене «до 12 $».
    4. Проверить список товаров.
  expected-result: |
    Товар отображается в списке.
  actual-result: |
    Товар не отображается.

- summary: |
    При снятии флажка «В наличии» все товары исчезают (отображается пустой список)
  environment: |
    Mozilla Firefox (последняя версия, точная версия не проверялась), Windows 11
    Hexlet Store (репозиторий qa-engineer-project-84)
  steps-to-reproduce: |
    1. Открыть страницу каталога товаров.
    2. Убедиться, что товары отображаются (флажок «В наличии» установлен).
    3. Снять флажок «В наличии».
  expected-result: |
    Отображаются товары с учётом остальных фильтров (при отсутствии других фильтров — все товары), список не пустой.
  actual-result: |
    Все товары исчезают, отображается пустой список.

- summary: |
    Хештег (например, beauty) в карточке товара выглядит кликабельным, но при нажатии ничего не происходит
  environment: |
    Mozilla Firefox, Windows 11
    Hexlet Store (репозиторий qa-engineer-project-84)
  steps-to-reproduce: |
    1. Открыть страницу каталога товаров.
    2. Найти карточку товара с хештегом (например, beauty).
    3. Нажать на этот хештег.
  expected-result: |
    Должен сработать фильтр: список товаров должен обновиться (отобразиться товары с этой меткой).
  actual-result: |
    При нажатии на хештег ничего не происходит: список товаров не меняется, ошибок нет.

